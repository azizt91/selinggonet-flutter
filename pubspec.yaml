name: selinggonet
description: Selinggonet Mobile - ISP Customer Management System
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Network & API
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # UI Components
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  lottie: ^3.1.2

  # Charts
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^25.2.7

  # Forms & Validation
  flutter_form_builder: ^9.3.0
  form_builder_validators: ^10.0.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  url_launcher: ^6.3.0
  path_provider: ^2.1.3

  # Notifications
  flutter_local_notifications: ^17.1.2

  # Biometric
  local_auth: ^2.2.0

  # Maps
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0

  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: 10.7.0

  # Date & Time
  timeago: ^3.6.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Image
  image_cropper: ^7.0.0
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

